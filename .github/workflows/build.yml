name: Build & Package
on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "baseline-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本号（例如 v1.1.36 或 baseline-1.1.36；留空则自动推断）"
        required: false
        type: string
        default: ""
permissions:
  contents: write
jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim()
          if (-not $ver -and "$env:GITHUB_REF_TYPE" -eq "tag") {
            $ver = "$env:GITHUB_REF_NAME".Trim()
          }
          if (-not $ver) {
            $shortSha = "$env:GITHUB_SHA".Substring(0, 7)
            $ver = "dev-$shortSha"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        shell: pwsh
        run: |
          go test -count=1 -v ./...

      - name: Install rsrc for resource embedding
        id: install-rsrc-for-resource-embedding
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $goBin = "$(go env GOPATH)\bin"
          $rsrcFullPath = Join-Path $goBin "rsrc.exe"
          Write-Host "rsrc full path(raw): $rsrcFullPath"
          if (-not (Test-Path $rsrcFullPath)) {
            throw "rsrc.exe not found after install"
          }
          $rsrcEnvPath = $rsrcFullPath -replace '\\','/'
          "RSRC_EXE=$rsrcEnvPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RSRC_EXE=$rsrcEnvPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Written RSRC_EXE to GITHUB_ENV: $env:RSRC_EXE"

      - name: Build xehn.exe (skip full pack, no core binaries download)
        shell: pwsh
        run: |
          Write-Host "==== DEBUG RSRC_EXE ===="
          Write-Host "RSRC_EXE env value: '$env:RSRC_EXE'"
          if ($env:RSRC_EXE) {
              Write-Host "RSRC_EXE file exists: $(Test-Path $env:RSRC_EXE)"
          }
          Write-Host "========================"
          $here = $PWD.Path
          $dist = Join-Path $here 'dist'
          $buildDir = Join-Path $dist 'build'
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          $binOut = Join-Path $buildDir 'xehn.exe'
          $syso = Join-Path $here 'rsrc_windows_amd64.syso'
          $icoArgs = @()
          if (Test-Path (Join-Path $here 'logo.ico')) { $icoArgs = @('-ico', (Join-Path $here 'logo.ico')) }
          # run rsrc embed manifest/icon
          & $env:RSRC_EXE -manifest (Join-Path $here 'app.manifest') @icoArgs -o $syso -arch amd64
          if ($LASTEXITCODE -ne 0) { throw "rsrc embed failed" }
          # compile windows gui binary
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          $ver = "${{ steps.ver.outputs.version }}"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$ver -X main.windowsGUIBuild=1" -o $binOut .
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          Write-Host "Build done: $binOut"
          Get-ChildItem $buildDir

      - name: Collect build artifacts
        id: pkg
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "dist_artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeSrc = Join-Path $PWD.Path "dist\build\xehn.exe"
          Copy-Item -Path $exeSrc -Destination $outDir -Force
          $exeOut = Join-Path $outDir "xehn-${{ steps.ver.outputs.version }}-windows-amd64.exe"
          Rename-Item -Path (Join-Path $outDir "xehn.exe") -NewName $exeOut
          "exe_path=$exeOut" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $outDir

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-windows-amd64-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.exe_path }}
          retention-days: 90

      # Note: full release zip bundle with mihomo core is built locally via pack.ps1,
      # GitHub‑Actions windows runner cannot reliably download mihomo release binary from internet.
      # Tag‑push auto‑release is disabled.
