name: Build & Package
on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "baseline-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本号（例如 v1.1.36 或 baseline-1.1.36；留空则自动推断）"
        required: false
        type: string
        default: ""
permissions:
  contents: write
jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim()
          if (-not $ver -and "$env:GITHUB_REF_TYPE" -eq "tag") {
            $ver = "$env:GITHUB_REF_NAME".Trim()
          }
          if (-not $ver) {
            $shortSha = "$env:GITHUB_SHA".Substring(0, 7)
            $ver = "dev-$shortSha"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        shell: pwsh
        run: |
          go test -count=1 -v ./...

      - name: Install rsrc for resource embedding
        id: install-rsrc-for-resource-embedding
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $goBin = "$(go env GOPATH)\bin"
          $rsrcFullPath = Join-Path $goBin "rsrc.exe"
          Write-Host "rsrc full path(raw): $rsrcFullPath"
          if (-not (Test-Path $rsrcFullPath)) {
            throw "rsrc.exe not found after install"
          }
          $rsrcEnvPath = $rsrcFullPath -replace '\\','/'
          "RSRC_EXE=$rsrcEnvPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RSRC_EXE=$rsrcEnvPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Written RSRC_EXE to GITHUB_ENV: $env:RSRC_EXE"

      - name: Prepare core binaries and geo assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\core" | Out-Null
          $mihomoExe = ".\core\mihomo.exe"
          $mihomoZipUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-windows-amd64.zip"
          $tmpZip = Join-Path $env:RUNNER_TEMP "mihomo.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "mihomo_extracted"
          $downloadOk = $false
          for($i=0;$i -lt 3;$i++){
            Write-Host "--- Attempt $($i+1) download mihomo zip ---"
            try{
              & curl.exe -L --connect-timeout 20 --max-time 120 -o "$tmpZip" "$mihomoZipUrl" 2>&1
              Write-Host "curl LASTEXITCODE: $LASTEXITCODE"
              if ($LASTEXITCODE -eq 0 -and (Test-Path $tmpZip) -and ((Get-Item $tmpZip).Length -gt 10000)) {
                Write-Host "Download success, file size: $((Get-Item $tmpZip).Length)"
                $downloadOk = $true
                break
              }
              throw "curl exit $LASTEXITCODE or file too small"
            }catch{
              Write-Warning "Download attempt $($i+1) failed: $_"
              Start-Sleep 8
            }
          }
          if(-not $downloadOk){
            throw "mihomo zip download failed after 3 retries"
          }
          Expand-Archive -Path $tmpZip -DestinationPath $extractDir -Force
          $foundExe = Get-ChildItem -Path $extractDir -Filter "*.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $foundExe.FullName -Destination $mihomoExe -Force
          if (-not (Test-Path $mihomoExe) -or ((Get-Item $mihomoExe).Length -lt 1MB)) {
            throw "core\mihomo.exe 缺失或大小小于 1MB"
          }
          $geositeUrl = "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          $geoipUrl = "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.metadb"
          Write-Host "Download geosite.dat"
          & curl.exe -L --connect-timeout 20 --max-time 120 -o ".\core\geosite.dat" "$geositeUrl" 2>&1
          Write-Host "Download geoip.metadb"
          & curl.exe -L --connect-timeout 20 --max-time 120 -o ".\core\geoip.metadb" "$geoipUrl" 2>&1
          Write-Host "=== core dir listing ==="
          Get-ChildItem .\core

      - name: Run pack.ps1
        shell: pwsh
        run: |
          Write-Host "==== DEBUG RSRC_EXE ===="
          Write-Host "RSRC_EXE env value: '$env:RSRC_EXE'"
          if ($env:RSRC_EXE) {
              Write-Host "RSRC_EXE file exists: $(Test-Path $env:RSRC_EXE)"
          }
          Write-Host "========================"
          if (-not (Test-Path ".\pack.ps1")) {
            throw "未找到 pack.ps1，请确认仓库根目录存在打包脚本"
          }
          Get-ChildItem .
          & ".\pack.ps1"
          Write-Host "=== after pack.ps1, listing current dir ==="
          Get-ChildItem . -Filter *.zip

      - name: Collect build artifacts
        id: pkg
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "dist_packages"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zips = Get-ChildItem -Path . -Filter "*.zip" | Where-Object { $_.FullName -notlike "$env:RUNNER_TEMP*" }
          if ($zips.Count -gt 0) {
            foreach ($z in $zips) {
              Copy-Item -Path $z.FullName -Destination $outDir -Force
            }
          } else {
            $ver = "${{ steps.ver.outputs.version }}"
            $fallbackZip = Join-Path $outDir "xehn-$ver-windows-amd64.zip"
            Compress-Archive -Path ".\*" -DestinationPath $fallbackZip -Force
          }
          $firstZip = Get-ChildItem -Path $outDir -Filter "*.zip" | Select-Object -First 1
          "zip_path=$($firstZip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem -Path $outDir | Format-Table Name, Length -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-windows-amd64-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.zip_path }}
          retention-days: 90

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/baseline-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.pkg.outputs.zip_path }}
          generate_release_notes: true
